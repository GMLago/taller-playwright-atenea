name: CI- Clonando App y ejecutando pruebas
on:
  push:
    branches: [main]
  pull_request:
      branches: [main]

jobs:
  test: 
      runs-on: ubuntu-latest
      services:
        mongo: 
          image: mongo:6.0
          ports:  
            - 27017:27017

      env: 
        MONGO_URI: ${{ secrets.MONGO_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        PORT: 6007
        VITE_API_URL: http://localhost:6007/api

      steps:
      - name: Checkout repository actual con el workflow              
        uses: actions/checkout@v3   

      - name: Clonar el repositorio de Athena Redux Bank
        run: |
          git clone https://github.com/Atenea-Conocimientos/redux-athena-bank.git app
    
      - name: Crear archvo .env para backend
        run: |
         echo "MONGO_URI=${{ env.MONGO_URI }}" > app/backend/.env
         echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> app/backend/.env
         echo "PORT=${{ env.PORT }}" >> app/backend/.env
         echo "VITE_API_URL=${{ env.VITE_API_URL }}" >> app/backend/.env

      - name: Instalar dependencias del backend    
        run: |
         cd app/backend
         npm install

      - name: Construir el backend
        run: |
         cd app/backend
         npm run dev > backend.log 2>&1 &

      - name: Instalar wait-on
        run: |
         npm install -g wait-on
     
        # Esperar a que el backend esté listo en el puerto 6007
      - name: Esperar backend 
        run: |
         wait-on tcp:6007

      - name: Instalar dependencias del frontend
        run: |
         cd app/frontend
         npm install
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      #Esperar a que el frontend esté listo 
      - name: Esperar frontend
        run: wait-on http://localhost:3000

      #Ejecutar pruebas 
      - name: Instalar y ejecutar pruebas -setup Playwright y Chromium
        run: |
         cd tests
         npm install
         npx playwright install --with-deps
         npx playwright test --reporter=html
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: playwright-report
          path: ./playwright-report

      - name: deployar reportes a github pages
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clonar gh-pages en carpeta temporal
          cd $RUNNER_TEMP
          git clone --depth=1 --branch=gh-pages https://x-access-token:${{ secrets.GH_PAGES_PAT }}@github.com/${{ github.repository }} gh-pages
       
          cd gh-pages

          # Limpiar la carpeta
          rm -rd ./*

          # Copiar los reportes de pruebas
          mkdir -r report-${GITHUB_RUN_NUMBER}
          cp -r $GITHUB_WORKSPACE/playwright-report/* ./report-${GITHUB_RUN_NUMBER}/

          # Commit y push
          git add .
          git commit -m "Reporte Playwright - Build $GITHUB_RUN_NUMBER"
          git push origin gh-pages

      - name: Imprimir link en la consola
        run: |
            echo "Reporte de pruebas disponible en: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report-${{ github.run_number }}/"




